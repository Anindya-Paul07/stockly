name: stockly
description: Offline personal inventory with SQLite and Excel reports.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  excel: 4.0.6
  share_plus: 10.1.4
  flutter_animate: 4.5.2
  flutter_svg: 2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4
flutter:
  uses-material-design: true
